name: Security Scan

on:
  schedule:
    - cron: "0 3 * * *"   # Tous les jours à 03:00
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Audit
        run: |
          cargo install cargo-audit
          cd Rust/core
          cargo audit

      - name: Android Dependency Check
        run: |
          cd Android
          ./gradlew dependencies
